<svg width="100%" height="100%" viewBox="0 0 1200 300" preserveAspectRatio="xMidYMid slice" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0f0c29;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#302b63;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#24243e;stop-opacity:1" />
    </linearGradient>

    <!-- Text Gradient -->
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#ff00cc;stop-opacity:1">
        <animate attributeName="stop-color" values="#ff00cc;#333399;#ff00cc" dur="4s" repeatCount="indefinite" />
      </stop>
      <stop offset="100%" style="stop-color:#333399;stop-opacity:1">
        <animate attributeName="stop-color" values="#333399;#ff00cc;#333399" dur="4s" repeatCount="indefinite" />
      </stop>
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="glow">
      <feGaussianBlur stdDeviation="2.5" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background Rect -->
  <rect width="100%" height="100%" fill="url(#bgGrad)" rx="15" ry="15"/>

  <!-- Animated Particles -->
  <circle cx="10%" cy="20%" r="2" fill="#fff" opacity="0.3">
    <animate attributeName="cy" values="20%;10%;20%" dur="5s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.3;0.8;0.3" dur="5s" repeatCount="indefinite"/>
  </circle>
  <circle cx="90%" cy="80%" r="3" fill="#fff" opacity="0.2">
    <animate attributeName="cy" values="80%;90%;80%" dur="7s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.2;0.6;0.2" dur="7s" repeatCount="indefinite"/>
  </circle>
    <circle cx="50%" cy="50%" r="1" fill="#fff" opacity="0.1">
    <animate attributeName="r" values="1;100;1" dur="10s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.1;0.0;0.1" dur="10s" repeatCount="indefinite"/>
  </circle>

  <!-- Main Title -->
  <text x="50%" y="55%" text-anchor="middle" font-family="'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-weight="900" font-size="90" fill="url(#textGrad)" filter="url(#glow)">
    MIKENEKO
    <animate attributeName="letter-spacing" values="5;10;5" dur="3s" repeatCount="indefinite"/>
  </text>

  <!-- Subtitle -->
  <text x="50%" y="75%" text-anchor="middle" font-family="'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-weight="300" font-size="28" fill="#a8a8b3" letter-spacing="3">
    NEXT GEN MUSIC EXPERIENCE
  </text>

  <!-- Decorative Line -->
  <line x1="30%" y1="85%" x2="70%" y2="85%" stroke="url(#textGrad)" stroke-width="2" opacity="0.5">
     <animate attributeName="x1" values="30%;20%;30%" dur="4s" repeatCount="indefinite"/>
     <animate attributeName="x2" values="70%;80%;70%" dur="4s" repeatCount="indefinite"/>
  </line>

</svg>
