<svg width="100%" height="150" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#5865F2;stop-opacity:1">
        <animate attributeName="stop-color" values="#5865F2;#EB459E;#5865F2" dur="4s" repeatCount="indefinite"/>
      </stop>
      <stop offset="50%" style="stop-color:#EB459E;stop-opacity:1">
        <animate attributeName="stop-color" values="#EB459E;#ED4245;#EB459E" dur="4s" repeatCount="indefinite"/>
      </stop>
      <stop offset="100%" style="stop-color:#ED4245;stop-opacity:1">
        <animate attributeName="stop-color" values="#ED4245;#5865F2;#ED4245" dur="4s" repeatCount="indefinite"/>
      </stop>
    </linearGradient>

    <linearGradient id="grad2" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#FEE75C;stop-opacity:1"/>
      <stop offset="50%" style="stop-color:#57F287;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#FEE75C;stop-opacity:1"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="100%" height="150" fill="#23272A"/>

  <!-- Animated waves -->
  <path d="M0,100 Q250,80 500,100 T1000,100 T1500,100 T2000,100 V150 H0 Z" fill="url(#grad1)" opacity="0.3">
    <animate attributeName="d"
      values="M0,100 Q250,80 500,100 T1000,100 T1500,100 T2000,100 V150 H0 Z;
              M0,100 Q250,120 500,100 T1000,100 T1500,100 T2000,100 V150 H0 Z;
              M0,100 Q250,80 500,100 T1000,100 T1500,100 T2000,100 V150 H0 Z"
      dur="6s" repeatCount="indefinite"/>
  </path>

  <path d="M0,115 Q250,95 500,115 T1000,115 T1500,115 T2000,115 V150 H0 Z" fill="url(#grad1)" opacity="0.2">
    <animate attributeName="d"
      values="M0,115 Q250,95 500,115 T1000,115 T1500,115 T2000,115 V150 H0 Z;
              M0,115 Q250,135 500,115 T1000,115 T1500,115 T2000,115 V150 H0 Z;
              M0,115 Q250,95 500,115 T1000,115 T1500,115 T2000,115 V150 H0 Z"
      dur="8s" repeatCount="indefinite"/>
  </path>

  <!-- Title -->
  <text x="50%" y="55" font-family="Arial, sans-serif" font-size="36" font-weight="bold" fill="#FFFFFF" text-anchor="middle">
    Discord Lavalink Music Bot
  </text>

  <!-- Subtitle -->
  <text x="50%" y="90" font-family="Arial, sans-serif" font-size="16" fill="#B9BBBE" text-anchor="middle">
    Production-Ready • TypeScript • Lavalink v4 • Slash Commands
  </text>

  <!-- Musical notes -->
  <g fill="url(#grad2)" opacity="0.8">
    <text x="8%" y="45" font-size="28">♪
      <animate attributeName="y" values="45;35;45" dur="2s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.8;0.4;0.8" dur="2s" repeatCount="indefinite"/>
    </text>
    <text x="92%" y="55" font-size="32">♫
      <animate attributeName="y" values="55;45;55" dur="2.5s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.8;0.4;0.8" dur="2.5s" repeatCount="indefinite"/>
    </text>
    <text x="5%" y="125" font-size="24">♬
      <animate attributeName="y" values="125;115;125" dur="3s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.8;0.4;0.8" dur="3s" repeatCount="indefinite"/>
    </text>
    <text x="95%" y="130" font-size="26">♩
      <animate attributeName="y" values="130;120;130" dur="2.8s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.8;0.4;0.8" dur="2.8s" repeatCount="indefinite"/>
    </text>
  </g>
</svg>
