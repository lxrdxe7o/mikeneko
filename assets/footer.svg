<svg width="100%" height="120" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="footerGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#5865F2;stop-opacity:1">
        <animate attributeName="stop-color" values="#5865F2;#EB459E;#5865F2" dur="5s" repeatCount="indefinite"/>
      </stop>
      <stop offset="50%" style="stop-color:#57F287;stop-opacity:1">
        <animate attributeName="stop-color" values="#57F287;#FEE75C;#57F287" dur="5s" repeatCount="indefinite"/>
      </stop>
      <stop offset="100%" style="stop-color:#ED4245;stop-opacity:1">
        <animate attributeName="stop-color" values="#ED4245;#5865F2;#ED4245" dur="5s" repeatCount="indefinite"/>
      </stop>
    </linearGradient>

    <linearGradient id="starGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FEE75C;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#F1C40F;stop-opacity:1"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="100%" height="120" fill="#23272A"/>

  <!-- Top wave -->
  <path d="M0,0 Q250,20 500,0 T1000,0 T1500,0 T2000,0 V40 Q1750,20 1500,40 T1000,40 T500,40 T0,40 Z"
        fill="url(#footerGrad)" opacity="0.2">
    <animate attributeName="d"
      values="M0,0 Q250,20 500,0 T1000,0 T1500,0 T2000,0 V40 Q1750,20 1500,40 T1000,40 T500,40 T0,40 Z;
              M0,0 Q250,0 500,20 T1000,0 T1500,20 T2000,0 V40 Q1750,40 1500,20 T1000,40 T500,20 T0,40 Z;
              M0,0 Q250,20 500,0 T1000,0 T1500,0 T2000,0 V40 Q1750,20 1500,40 T1000,40 T500,40 T0,40 Z"
      dur="8s" repeatCount="indefinite"/>
  </path>

  <!-- Equalizer bars -->
  <g transform="translate(100, 40)">
    <rect x="0" y="20" width="8" height="30" fill="url(#footerGrad)" rx="2">
      <animate attributeName="height" values="30;50;20;40;30" dur="1.2s" repeatCount="indefinite"/>
      <animate attributeName="y" values="20;0;30;10;20" dur="1.2s" repeatCount="indefinite"/>
    </rect>
    <rect x="15" y="10" width="8" height="40" fill="url(#footerGrad)" rx="2">
      <animate attributeName="height" values="40;25;45;30;40" dur="1.5s" repeatCount="indefinite"/>
      <animate attributeName="y" values="10;25;5;20;10" dur="1.5s" repeatCount="indefinite"/>
    </rect>
    <rect x="30" y="5" width="8" height="45" fill="url(#footerGrad)" rx="2">
      <animate attributeName="height" values="45;35;50;25;45" dur="1.3s" repeatCount="indefinite"/>
      <animate attributeName="y" values="5;15;0;25;5" dur="1.3s" repeatCount="indefinite"/>
    </rect>
    <rect x="45" y="15" width="8" height="35" fill="url(#footerGrad)" rx="2">
      <animate attributeName="height" values="35;45;20;40;35" dur="1.4s" repeatCount="indefinite"/>
      <animate attributeName="y" values="15;5;30;10;15" dur="1.4s" repeatCount="indefinite"/>
    </rect>
    <rect x="60" y="25" width="8" height="25" fill="url(#footerGrad)" rx="2">
      <animate attributeName="height" values="25;40;30;20;25" dur="1.6s" repeatCount="indefinite"/>
      <animate attributeName="y" values="25;10;20;30;25" dur="1.6s" repeatCount="indefinite"/>
    </rect>
  </g>

  <!-- Center text -->
  <text x="50%" y="60" font-family="Arial, sans-serif" font-size="16" fill="#FFFFFF" text-anchor="middle" font-weight="bold">
    Built with ❤️ using TypeScript and discord.js v14
  </text>

  <!-- Tech badges -->
  <g transform="translate(0, 75)">
    <text x="50%" y="0" font-family="monospace" font-size="12" fill="#B9BBBE" text-anchor="middle">
      discord.js • Shoukaku • Lavalink • Docker • Node.js 20+
    </text>
  </g>

  <!-- Animated stars -->
  <g fill="url(#starGrad)">
    <circle cx="20%" cy="30" r="2">
      <animate attributeName="opacity" values="0.3;1;0.3" dur="2s" repeatCount="indefinite"/>
      <animate attributeName="r" values="2;3;2" dur="2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="80%" cy="25" r="2.5">
      <animate attributeName="opacity" values="0.3;1;0.3" dur="2.5s" repeatCount="indefinite"/>
      <animate attributeName="r" values="2.5;3.5;2.5" dur="2.5s" repeatCount="indefinite"/>
    </circle>
    <circle cx="30%" cy="20" r="1.5">
      <animate attributeName="opacity" values="0.3;1;0.3" dur="3s" repeatCount="indefinite"/>
      <animate attributeName="r" values="1.5;2.5;1.5" dur="3s" repeatCount="indefinite"/>
    </circle>
    <circle cx="70%" cy="35" r="2">
      <animate attributeName="opacity" values="0.3;1;0.3" dur="2.8s" repeatCount="indefinite"/>
      <animate attributeName="r" values="2;3;2" dur="2.8s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- Copyright -->
  <text x="50%" y="105" font-family="Arial, sans-serif" font-size="11" fill="#72767D" text-anchor="middle">
    © 2024 Discord Lavalink Music Bot • MIT License
  </text>
</svg>
