<svg width="100%" height="100%" viewBox="0 0 1200 150" preserveAspectRatio="xMidYMid slice" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0f0c29;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#302b63;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#24243e;stop-opacity:1" />
    </linearGradient>
     <linearGradient id="barGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#ff00cc;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#333399;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="100%" height="100%" fill="url(#bgGrad)" rx="15" ry="15"/>

  <!-- Content Group -->
  <g transform="translate(600, 75)">
    <!-- Text -->
    <text x="0" y="-10" text-anchor="middle" font-family="'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="20" fill="#fff" font-weight="600">
      Made with <tspan fill="#ff00cc">❤️</tspan> by xero
    </text>
    
    <text x="0" y="20" text-anchor="middle" font-family="monospace" font-size="14" fill="#8888aa">
      github.com/lxrdxe7o
    </text>

    <!-- Animated Equalizer Bars (Left) -->
    <rect x="-240" y="-15" width="6" height="30" fill="url(#barGrad)" opacity="0.8">
      <animate attributeName="height" values="10;30;15;25;10" dur="0.8s" repeatCount="indefinite" />
      <animate attributeName="y" values="5;-15;0;-10;5" dur="0.8s" repeatCount="indefinite" />
    </rect>
    <rect x="-225" y="-20" width="6" height="40" fill="url(#barGrad)" opacity="0.8">
      <animate attributeName="height" values="20;40;10;35;20" dur="1.1s" repeatCount="indefinite" />
      <animate attributeName="y" values="0;-20;10;-15;0" dur="1.1s" repeatCount="indefinite" />
    </rect>
    <!-- Animated Equalizer Bars (Right) -->
    <rect x="220" y="-20" width="6" height="40" fill="url(#barGrad)" opacity="0.8">
      <animate attributeName="height" values="20;40;10;35;20" dur="1.1s" repeatCount="indefinite" />
      <animate attributeName="y" values="0;-20;10;-15;0" dur="1.1s" repeatCount="indefinite" />
    </rect>
     <rect x="235" y="-15" width="6" height="30" fill="url(#barGrad)" opacity="0.8">
      <animate attributeName="height" values="10;30;15;25;10" dur="0.8s" repeatCount="indefinite" />
      <animate attributeName="y" values="5;-15;0;-10;5" dur="0.8s" repeatCount="indefinite" />
    </rect>

  </g>
</svg>
